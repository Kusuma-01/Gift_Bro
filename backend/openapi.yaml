openapi: 3.0.0
info:
  title: GiftBro AI API
  description: Personalized Gift Recommendation Engine API
  version: 1.0.0
servers:
  - url: /api
    description: Base API URL
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
  /recommend-gifts:
    post:
      summary: Generate gift recommendations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                name:
                  type: string
                relationship:
                  type: string
                budget:
                  type: string
      responses:
        '200':
          description: OK
  /recipients:
    post:
      summary: Create recipient
      responses:
        '201':
          description: Created
    get:
      summary: Get recipients
      responses:
        '200':
          description: OK
